# UCSD DSMLP (datahub) config: real encoders, LIBERO data, home-dir storage.
# Home directories persist across pods, so everything lives under ~.

seed: 7

encoders:
  vision: google/siglip-base-patch16-224
  language: microsoft/Phi-3-mini-4k-instruct

data:
  source: libero
  synthetic_size: 512
  # Pod-local scratch: doesn't count against the home-dir quota. Ephemeral —
  # hpc/dsmlp_train.sh re-downloads it automatically when missing (~1-2 min
  # on the campus network).
  libero_dir: /tmp/via-libero
  suite: libero_spatial
  clip_len: 16
  num_workers: 4

belief:
  lr: 3.0e-4
  batch_size: 16
  epochs: 20
  # 1e-3 collapsed on LIBERO: a step-2.3k optimization spike tripled the KL
  # and sigma pinned at the floor (occluded/visible ratio 1.00). The stronger
  # leash keeps the posterior anchored so variance stays informative.
  kl_weight: 1.0e-2
  # Sensor-dropout augmentation: prob of blanking a 2-4 frame window per
  # clip. Required for calibrated variance — LIBERO demos have no natural
  # occlusions, so without it sigma has no reason to be input-dependent
  # (runs 1-2 both scored occ/vis ratio 1.00).
  occlude_p: 0.5
  # Per-clip, across-time variance floor on obs_embed — see
  # configs/default.yaml note. Prevents encode_obs from collapsing to a
  # near-constant vector to minimize the next-obs NLL. Found on the local
  # CPU/synthetic path, 2026-07-22; 1.0 and 20.0 both rebounded toward
  # collapse partway through a real full run, 100.0 held steady.
  var_weight: 100.0

world_model:
  lr: 3.0e-4
  batch_size: 16
  epochs: 20
  free_bits: 1.0

goal:
  lr: 3.0e-4
  batch_size: 64
  epochs: 10
  dataset_size: 4096

decision:
  lr: 3.0e-4
  batch_size: 16
  epochs: 10
  lambda_max: 2.0

checkpoints:
  dir: ~/via-checkpoints

wandb:
  project: via-model
