seed: 7

encoders:
  # "stub" for offline dev; on the GPU box set the HF model names:
  #   vision:   google/siglip-base-patch16-224
  #   language: microsoft/Phi-3-mini-4k-instruct
  vision: stub
  language: stub

data:
  # "synthetic" for smoke training; "libero" once demo hdf5s are downloaded.
  source: synthetic
  synthetic_size: 512
  libero_dir: datasets/libero
  suite: libero_spatial
  clip_len: 12
  num_workers: 4

belief:
  lr: 3.0e-4
  batch_size: 16
  epochs: 20
  kl_weight: 1.0e-2
  occlude_p: 0.5   # sensor-dropout augmentation; see configs/dsmlp.yaml note
  # Variance floor on obs_embed (VICReg-style), per clip, across time,
  # visible frames only. Without it encode_obs can collapse to a
  # near-constant vector and still minimize the next-obs NLL, since its own
  # no-grad copy is the prediction target — starves the world model of
  # positional signal. A batch-wide (not per-clip) floor didn't fix it: the
  # network satisfied it via between-clip differences instead of within-clip
  # motion. 1.0 and 20.0 looked fine in short trials but rebounded toward
  # collapse partway through a real full run; 100.0 held a steady descent.
  var_weight: 100.0

world_model:
  lr: 3.0e-4
  batch_size: 16
  epochs: 20
  free_bits: 1.0

goal:
  lr: 3.0e-4
  batch_size: 64
  epochs: 10
  dataset_size: 4096

decision:
  lr: 3.0e-4
  batch_size: 16
  epochs: 10
  lambda_max: 2.0

checkpoints:
  dir: checkpoints

wandb:
  project: via-model
